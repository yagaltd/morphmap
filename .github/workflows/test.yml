name: MorphMap CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile || bun install
      - run: bun test .morphmap/mech/
      - run: bun test .morphmap/mech-pi/
