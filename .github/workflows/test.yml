name: MorphMap CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: cd .morphmap/mech && bun test
      - run: cd .morphmap/mech-pi && bun test
      - run: npx tsc --noEmit
