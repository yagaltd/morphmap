view command &#xb7; outcome: implemented</p>","children":[],"payload":{"tag":"li","lines":"77,78"}},{"content":"\n<p data-lines=\"78,79\">[cross-cutting][decision][&#x1f4e6; 2026-07-23] branch-agent.md IS autonomous: writes .spec (step 3), spawns sub-branches recursively (step 0a), loops (step 11), uses /goal (step 0b/13). Does NOT use mech scripts &#x2014; they are not wired in.</p>","children":[],"payload":{"tag":"li","lines":"78,79"}},{"content":"\n<p data-lines=\"79,80\">[cross-cutting][decision][&#x1f4e6; 2026-07-23] delegate SKILL.md is one-shot: spawns branch agents, reports, exits. Does NOT loop or re-spawn. Branch agent loops internally, but delegate requires manual re-trigger.</p>","children":[],"payload":{"tag":"li","lines":"79,80"}},{"content":"\n<p data-lines=\"80,81\">[cross-cutting][decision][&#x1f4e6; 2026-07-23] mech scripts (Phases A-C) fully implemented + tested (115 tests green) but NOT wired into execution. morphmap-hooks.ts does not call any mech functions, does not register transition tools, does not read/write state.json. Phase D (hooks integration) is &quot;Soon&quot; per docs/mech-mindmap.md &#xa7;7.1.</p>","children":[],"payload":{"tag":"li","lines":"80,81"}},{"content":"\n<p data-lines=\"81,82\">[cross-cutting][decision][&#x1f4e6; 2026-07-23] Fractal loop exists at branch-agent level (steps 0-13 with repeat) but is NOT fully autonomous like Fractal (PREPARE&#x2192;PLAN&#x2192;EXECUTE&#x2192;REVIEW&#x2192;COMMIT). Delegate is one-shot, Root is trigger-based, leaf worker is one-shot.</p>","children":[],"payload":{"tag":"li","lines":"81,82"}},{"content":"\n<p data-lines=\"82,83\">[cross-cutting][risk][&#x1f4e6; 2026-07-23] CRITICAL: mech state machine is dead code &#x2014; 115 tests pass but gates never run during execution. Completion is still trust-based.</p>","children":[],"payload":{"tag":"li","lines":"82,83"}},{"content":"\n<p data-lines=\"83,84\">[cross-cutting][risk][&#x1f4e6; 2026-07-23] HIGH: delegate skill does not auto-loop. No autonomous re-trigger after branch completion.</p>","children":[],"payload":{"tag":"li","lines":"83,84"}},{"content":"\n<p data-lines=\"84,85\">[cross-cutting][decision][&#x1f4e6; 2026-07-23] Phase D (hooks integration) is the highest priority gap. Wire mech into morphmap-hooks.ts, register transition tools, create state.json.</p>","children":[],"payload":{"tag":"li","lines":"84,85"}},{"content":"\n<p data-lines=\"85,86\">[cross-cutting][decision][&#x1f4e6; 2026-07-23] docs/one-map.md promoted to reference doc for all new implementation. Replaces mech-mindmap.md as the primary architecture doc. mech-mindmap.md remains as the state machine spec (&#xa7;2-&#xa7;8).</p>","children":[],"payload":{"tag":"li","lines":"85,86"}},{"content":"\n<p data-lines=\"86,87\">[cross-cutting][decision][&#x1f4e6; 2026-07-23] Phase structure clarified: Phases A-F = pure state machine core (180 tests green). Phase D = impure wiring (NOT wired &#x2014; highest priority gap). one-map phases = Phase D (wire mech) &#x2192; Phase one-map (unify entities, add /morphmap-run, add compiler hook).</p>","children":[],"payload":{"tag":"li","lines":"86,87"}},{"content":"\n<p data-lines=\"87,88\">[cross-cutting][decision][&#x1f4e6; 2026-07-23] herdr removed from one-map.md. pi-subagents retained for context isolation. herdr deferred to Phase 3 (future).</p>","children":[],"payload":{"tag":"li","lines":"87,88"}},{"content":"\n<p data-lines=\"88,89\">[cross-cutting][decision][&#x1f4e6; 2026-07-23] <code>--loop</code> flag on <code>/morphmap-delegate</code>: re-check for newly-ready branches after completions, re-spawn, repeat.</p>","children":[],"payload":{"tag":"li","lines":"88,89"}},{"content":"\n<p data-lines=\"89,90\">[cross-cutting][decision][&#x1f4e6; 2026-07-23] Compiler hook: parse agent JSONL on tool_result events, extract evidence (test/build exit codes, files changed), call mech state machine. Replaces agent self-summarization.</p>","children":[],"payload":{"tag":"li","lines":"89,90"}},{"content":"\n<p data-lines=\"90,91\">[cross-cutting][implemented][&#x1f4e6; 2026-07-23] docs/one-map.md v2 patched: removed herdr, added phase structure, added implementation plan (&#xa7;9), added /morphmap-run design, added compiler hook design, added Node metadata schema.</p>","children":[],"payload":{"tag":"li","lines":"90,91"}},{"content":"\n<p data-lines=\"91,92\">[cross-cutting][decision][&#x1f4e6; 2026-07-23] Phase D: restore mech-pi/ wiring layer, register 3 transition tools in hooks, bootstrap state.json from mindmap, implement md&#x2194;json sync hook, update agent prompts to use mech tools.</p>","children":[],"payload":{"tag":"li","lines":"91,92"}},{"content":"\n<p data-lines=\"92,93\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] morphmap-amend used for own implementation &#xb7; outcome: &#x2705;</p>","children":[],"payload":{"tag":"li","lines":"92,93"}},{"content":"\n<p data-lines=\"93,94\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] mech Phase A: pure state machine core &#x2192; .morphmap/mech/{types,state,config,index}.ts + state.test.ts &#xb7; 707 LOC pure + 492 LOC test &#xb7; 49 tests passing &#xb7; tsc clean</p>","children":[],"payload":{"tag":"li","lines":"93,94"}},{"content":"\n<p data-lines=\"94,95\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] idempotency = (leaf, to, evidenceHash) exists in transitions[] AND current status === to &#x2192; no-op pass (crash-recovery safe, &#xa7;8.1). Avoids duplicate log entries on replay.</p>","children":[],"payload":{"tag":"li","lines":"94,95"}},{"content":"\n<p data-lines=\"95,96\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] reviewRounds increments ONLY on in_review &#x2192; in_progress (CHANGES_REQUESTED loop), not on every transition</p>","children":[],"payload":{"tag":"li","lines":"95,96"}},{"content":"\n<p data-lines=\"96,97\">[cross-cutting][learn][&#x1f4e6; 2026-07-22] Phase A actual 707 LOC vs plan est. 200 &#x2014; confirms finding J (estimates optimistic). state.ts alone 337 (StateMachine + idempotency + dep-resolution). Total mech est. holds at ~2100-2800.</p>","children":[],"payload":{"tag":"li","lines":"96,97"}},{"content":"\n<p data-lines=\"97,98\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] morphmap/quality-reviewer used for mech Phase A &#xb7; outcome: CHANGES_REQUESTED (1&#xd7;P1, 1&#xd7;P2, 2&#xd7;P3) &#xb7; tdd-guard lint: 6/6 pass &#xb7; handoff: .morphmap/quality-review-001-20260722-mech-phaseA.md</p>","children":[],"payload":{"tag":"li","lines":"97,98"}},{"content":"\n<p data-lines=\"98,99\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] P2 fix: <code>done</code> made terminal (done&#x2192;done rejected) &#x2014; prevents silent evidence mutation of approved proof. Idempotency reordered BEFORE legality so crash-recovery replay stays a safe no-op.</p>","children":[],"payload":{"tag":"li","lines":"98,99"}},{"content":"\n<p data-lines=\"99,100\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] P3 fix: transitionLeaf reuses runGates (single gate runner &#x2014; was divergent duplicate that dropped warnings); warnings now surface in outcome</p>","children":[],"payload":{"tag":"li","lines":"99,100"}},{"content":"\n<p data-lines=\"100,101\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] P3 fix: +8 tests covering gaps (done terminal, done-mutation rejection, done idempotent replay, blocked/unblock via transitionLeaf, mixed needs+needs-contract edges, ghost target, warning surfacing) &#x2192; 57 tests, 131 expects, all green</p>","children":[],"payload":{"tag":"li","lines":"100,101"}},{"content":"\n<p data-lines=\"101,102\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] non-blocking: tsconfig.mech.json &#x2192; tsconfig.json (conventional name, bare <code>tsc</code> works)</p>","children":[],"payload":{"tag":"li","lines":"101,102"}},{"content":"\n<p data-lines=\"102,103\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] logged decision #3 diverged from spec &#xa7;3.6 without amending the spec &#x2014; process violation caught by review. Lesson: decisions must cite &amp; reconcile the spec, not override silently. This is the mech thesis working: review turned a self-claimed &#x2705; into verified &#x2705;.</p>","children":[],"payload":{"tag":"li","lines":"102,103"}},{"content":"\n<p data-lines=\"103,104\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] Phase B gates &#x2192; .morphmap/mech/gates/{pre-spawn,submit,review,integration}.ts + .morphmap/mech/lattice.ts &#xb7; preSpawn (7) + submit (6) + review (6) + integration (4) = 22 gates &#xb7; lattice maps transitions&#x2192;chains</p>","children":[],"payload":{"tag":"li","lines":"103,104"}},{"content":"\n<p data-lines=\"104,105\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] gates are PURE &#x2014; they validate already-populated LeafEvidence; impure layer (Phase D) gathers evidence (runs CLI, reads files). Keeps gates unit-testable, no I/O.</p>","children":[],"payload":{"tag":"li","lines":"104,105"}},{"content":"\n<p data-lines=\"105,106\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] tool-absent pattern: null evidence field &#x2192; gate skips (pass). tdd-guard/bombadil/lonkero/healthCheck may be absent (finding A). Optional-result gate factory.</p>","children":[],"payload":{"tag":"li","lines":"105,106"}},{"content":"\n<p data-lines=\"106,107\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] Phase A TransitionGateCtx widened (optional graph/allLeaves/allowedChanges) so cross-leaf/dependency gates get data. Backward-compatible.</p>","children":[],"payload":{"tag":"li","lines":"106,107"}},{"content":"\n<p data-lines=\"107,108\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] integration test caught crossLeafNoConflict reading stale leaf.evidence instead of incoming evidence &#x2014; unit test missed it (fixture put files on leaf). Lesson: integration tests through transitionLeaf are essential, not optional.</p>","children":[],"payload":{"tag":"li","lines":"107,108"}},{"content":"\n<p data-lines=\"108,109\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] Phase C tools &#x2192; .morphmap/mech/tools.ts &#xb7; submitLeaf/approveLeaf/integrationGate &#xb7; pure handlers (Phase D wraps with pi.registerTool + state.json I/O)</p>","children":[],"payload":{"tag":"li","lines":"108,109"}},{"content":"\n<p data-lines=\"109,110\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] Phase C = pure tool handlers; Phase D = impure wiring. Tools select gates via lattice (agents don&apos;t pick gates), call transitionLeaf/runIntegrationGates, return agent-facing {accepted/passed, failures}. Keeps C testable.</p>","children":[],"payload":{"tag":"li","lines":"109,110"}},{"content":"\n<p data-lines=\"110,111\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] request_revision (&#xa7;4.2 escape hatch) deferred to Phase D &#x2014; not in &#xa7;2.5 tool list. Scope tight to plan.</p>","children":[],"payload":{"tag":"li","lines":"110,111"}},{"content":"\n<p data-lines=\"111,112\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] integrationGate marks branch status=done on pass (branch-level transition); returns unchanged state on fail.</p>","children":[],"payload":{"tag":"li","lines":"111,112"}},{"content":"\n<p data-lines=\"112,113\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] reviewFile param &#x21d2; evidence.qualityReviewExists=true (impure layer confirms path exists; pure tool trusts the flag).</p>","children":[],"payload":{"tag":"li","lines":"112,113"}},{"content":"\n<p data-lines=\"113,114\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] morphmap/quality-reviewer used for mech Phase B+C (batched) &#xb7; outcome: APPROVED WITH FINDINGS (0 blocking, 1&#xd7;P2, 3&#xd7;P3) &#xb7; handoff: .morphmap/quality-review-002-20260722-mech-phaseBC.md</p>","children":[],"payload":{"tag":"li","lines":"113,114"}},{"content":"\n<p data-lines=\"114,115\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] P2 fix: added runtimeDependenciesMet gate to reviewGates &#x2014; enforces integrateBlocked===false at in_review&#x2192;done. Closes the [needs-contract:] gap (leaf could reach done while runtime dep not done, false &quot;done=proof&quot;). approveLeaf now passes graph/allLeaves into ctx.</p>","children":[],"payload":{"tag":"li","lines":"114,115"}},{"content":"\n<p data-lines=\"115,116\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] P3 fix: removed unused LeafEvidence import in submit.ts</p>","children":[],"payload":{"tag":"li","lines":"115,116"}},{"content":"\n<p data-lines=\"116,117\">[cross-cutting][implemented][&#x1f4e6; 2026-07-22] P3 fix: +2 tests (pre-spawn chain via transitionLeaf; runtime-dep blocks approve) &#x2192; 115 tests, 276 expects, all green</p>","children":[],"payload":{"tag":"li","lines":"116,117"}},{"content":"\n<p data-lines=\"117,118\">[cross-cutting][decision][&#x1f4e6; 2026-07-22] P2 was a real enforcement gap invisible to self-verification (all 113 tests passed before) &#x2014; the needs-contract build/integrate split has two gates (buildBlocked at spawn, integrateBlocked at approve) and only the first existed. Review caught the missing half.</p>","children":[],"payload":{"tag":"li","lines":"117,118"}},{"content":"\n<p data-lines=\"118,119\">[cross-cutting][implemented][&#x1f4e6; 2026-07-21] mechanical reviewer wired into execution loop (was defined but never spawned)</p>","children":[],"payload":{"tag":"li","lines":"118,119"}},{"content":"\n<p data-lines=\"119,120\">[cross-cutting][implemented][&#x1f4e6; 2026-07-21] goal completion gate: 6 mechanical checks before update_goal complete</p>","children":[],"payload":{"tag":"li","lines":"119,120"}},{"content":"\n<p data-lines=\"120,121\">[cross-cutting][implemented][&#x1f4e6; 2026-07-21] available-skills.md cache: generated at init/delegate, read by all branch agents</p>","children":[],"payload":{"tag":"li","lines":"120,121"}},{"content":"\n<p data-lines=\"121,122\">[cross-cutting][implemented][&#x1f4e6; 2026-07-21] delegate skill: depth-agnostic spawning for all heading levels</p>","children":[],"payload": <script>// Auto-collapse ✅ branches in markmap render
// Injected into markmap HTML via --js flag

(function() {
  // Wait for markmap to render
  const observer = new MutationObserver(() => {
    const svg = document.querySelector('.markmap svg');
    if (!svg) return;

    // Find all ✅ nodes and collapse them
    const nodes = svg.querySelectorAll('g.markmap-node');
    nodes.forEach(node => {
      const text = node.textContent || '';
      // Collapse if branch shows ✅ (done/completed)
      // Don't collapse if it's a leaf (has no children)
      const circle = node.querySelector('circle.markmap-node-circle');
      const hasChildren = circle && circle.__data__?.payload?.fold !== undefined;
      
      if ((text.includes('✅') || text.includes('✅')) && hasChildren) {
        // Trigger collapse: click the circle
        const clickEvt = new MouseEvent('click', { bubbles: true });
        circle.dispatchEvent(clickEvt);
      }
    });

    observer.disconnect();
  });

  observer.observe(document.body, { childList: true, subtree: true });
})();
</script></body>
